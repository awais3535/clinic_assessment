# One repository, two independently deployed applications. No GitHub Actions.
services:
  - type: web
    name: pearl-dental-api
    runtime: node
    plan: free
    branch: develop
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pearl-dental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: STAFF_EMAIL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: CLINIC_TIMEZONE
        value: Asia/Karachi
  - type: web
    name: pearl-dental-web
    runtime: static
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: pearl-dental-db
    plan: free
    databaseName: clinic
    user: clinic
